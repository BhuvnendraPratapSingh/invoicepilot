# Render Blueprint - defines all services for this app
# See: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: invoicepilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: demo
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_BUSINESS_DATE
        value: "2026-03-15"
      - key: DATABASE_URL
        value: sqlite:///./data/invoicepilot.db
      - key: UPLOAD_DIR
        value: ./data/uploads
      - key: PYTHON_VERSION
        value: "3.11"
